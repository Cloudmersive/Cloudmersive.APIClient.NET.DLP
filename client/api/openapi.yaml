openapi: 3.0.1
info:
  description: Easily and directly scan and detect sensitive data (PII) in input text.
  title: dlpapi
  version: v1
servers:
- url: /
security:
- Apikey: []
paths:
  /dlp/detect/text:
    post:
      description: Detects configurable types of user data in an input text string
        using Advanced AI.
      operationId: DetectText
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlpDetectionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DlpDetectionRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DlpDetectionRequest'
        description: Input request
        required: false
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DlpDetectionResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DlpDetectionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DlpDetectionResponse'
          description: OK
      summary: Detect User Data in Input Text
      tags:
      - Detect
      x-codegen-request-body-name: body
  /dlp/detect/text/advanced:
    post:
      description: Detects 29 configurable types of user data including health-related
        PHI in an input text string using Advanced AI.
      operationId: DetectTextAdvanced
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlpAdvancedDetectionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DlpAdvancedDetectionRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DlpAdvancedDetectionRequest'
        description: Input request
        required: false
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DlpAdvancedDetectionResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DlpAdvancedDetectionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DlpAdvancedDetectionResponse'
          description: OK
      summary: Detect User Data in Input Text (Advanced)
      tags:
      - Detect
      x-codegen-request-body-name: body
  /dlp/detect/document/advanced:
    post:
      description: "Detects 29 configurable types of user data including health-related\
        \ PHI in a document (PDF, DOC, DOCX, XLS, XLSX, PPT, PPTX, HTML, EML, MSG,\
        \ PNG, JPG, WEBP) using Advanced AI."
      operationId: DetectDocumentAdvanced
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlpAdvancedDocumentDetectionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DlpAdvancedDocumentDetectionRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DlpAdvancedDocumentDetectionRequest'
        description: Input request
        required: false
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DlpAdvancedDetectionResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DlpAdvancedDetectionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DlpAdvancedDetectionResponse'
          description: OK
      summary: Detect User Data in Document Image (Advanced)
      tags:
      - Detect
      x-codegen-request-body-name: body
  /dlp/detect/document:
    post:
      description: "Detects configurable types of user data in a document (PDF, DOC,\
        \ DOCX, XLS, XLSX, PPT, PPTX, HTML, EML, MSG, PNG, JPG, WEBP) using Advanced\
        \ AI."
      operationId: DetectDocument
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlpDocumentDetectionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DlpDocumentDetectionRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DlpDocumentDetectionRequest'
        description: Input request
        required: false
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DlpDetectionResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DlpDetectionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DlpDetectionResponse'
          description: OK
      summary: Detect User Data in Document Image
      tags:
      - Detect
      x-codegen-request-body-name: body
  /dlp/detect/audio:
    post:
      description: "Transcribes an audio file (WAV, MP3, M4A, FLAC, OGG, WMA) and\
        \ detects 23 configurable types of user data in the transcript using Advanced\
        \ AI. Returns the full transcript, token timestamps, and detection results."
      operationId: DetectAudio
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlpAudioDetectionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DlpAudioDetectionRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DlpAudioDetectionRequest'
        description: Input request
        required: false
      responses:
