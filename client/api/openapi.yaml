      operationId: DetectAudioAdvancedBatchJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlpAdvancedAudioDetectionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DlpAdvancedAudioDetectionRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DlpAdvancedAudioDetectionRequest'
        description: Input request
        required: false
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DlpBatchJobResult'
            application/json:
              schema:
                $ref: '#/components/schemas/DlpBatchJobResult'
            text/json:
              schema:
                $ref: '#/components/schemas/DlpBatchJobResult'
          description: OK
