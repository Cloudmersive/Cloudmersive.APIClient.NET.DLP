        \ the status of the job and retrieve the redacted audio and transcript when\
        \ complete.  Transcribes an audio file (WAV, MP3, M4A, FLAC, OGG, WMA), detects\
        \ 34 configurable types of user data including health-related PHI in the transcript,\
        \ and redacts audio segments containing PII. Returns the redacted audio, redacted\
        \ transcript, detection results, redacted segment timestamps, and optional\
        \ rationale.  Requires Managed Instance or Private Cloud deployment."
      operationId: RedactAudioAdvancedBatchJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlpAdvancedAudioRedactionRequest'
          text/json:
            schema:
