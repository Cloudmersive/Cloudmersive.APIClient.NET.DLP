  /dlp/batch-job/status:
    get:
      description: "Returns the result of the Async Job - possible states can be STARTED\
        \ or COMPLETED.  When COMPLETED, the corresponding result field (detection\
        \ or redaction result) is populated on the response.  This API is only available\
        \ for Cloudmersive Managed Instance and Private Cloud deployments."
      operationId: GetAsyncJobStatus
      parameters:
      - description: Job ID for the batch job to get the status of
        in: query
        name: AsyncJobID
        schema:
          type: string
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DlpBatchJobStatusResult'
            application/json:
              schema:
                $ref: '#/components/schemas/DlpBatchJobStatusResult'
            text/json:
              schema:
                $ref: '#/components/schemas/DlpBatchJobStatusResult'
          description: OK
      summary: Get the status and result of a DLP Batch Job
      tags:
      - TasksBatchJob
components:
  schemas:
    AudioTimestamp:
      additionalProperties: false
      description: A single token with its timestamp from speech recognition.
      example:
        StartTimeMs: 1
        Token: Token
        EndTimeMs: 5
        CharacterOffsetStart: 0
        CharacterOffsetEnd: 6
      properties:
        Token:
          description: The word or token recognized from the audio.
          type: string
        CharacterOffsetStart:
          description: Start position of the token in the transcript text (character
            offset).
          format: int32
          type: integer
        CharacterOffsetEnd:
          description: End position of the token in the transcript text (character
            offset).
          format: int32
          type: integer
        StartTimeMs:
          description: "Start time of the token in the audio, in milliseconds."
          format: int64
          type: integer
        EndTimeMs:
          description: "End time of the token in the audio, in milliseconds."
          format: int64
          type: integer
      type: object
    CustomPiiField:
      additionalProperties: false
      description: "Caller-defined custom PII field. The redaction LLM will look for\
        \ content matching\r\nthe description and redact it as a semantic tag derived\
        \ from the title\r\n(e.g. title \"internal participant code\" → tag [INTERNAL-PARTICIPANT-CODE])."
      example:
        Description: alphanumeric study or research participant identifier code (e.g.
          studyMDD90231)
        Title: internal participant code
      properties:
        Title:
          description: "Short title for the custom field, also used to derive the\
            \ semantic tag (uppercased, spaces/underscores replaced with hyphens)."
          example: internal participant code
          type: string
        Description:
          description: "Description of what this field looks like, used to instruct\
            \ the redaction LLM. Be specific so the LLM can locate matches."
          example: alphanumeric study or research participant identifier code (e.g.
            studyMDD90231)
          type: string
      type: object
    DlpAdvancedAudioDetectionRequest:
      additionalProperties: false
      description: Request object for advanced DLP audio detection with 29 PII detection
        types including health-related data.
      example:
        AllowCreditCardExpirationDate: false
        AllowHealthDateAndTimeOfTreatment: false
        AllowHealthPaymentsMadeForTreatment: false
        AllowEmailAddress: false
        AllowCreditCardNumber: false
        AllowBankAccountNumber: false
        AllowHealthInsuranceMemberID: false
        AllowIpAddress: false
        AllowBearerToken: false
        AllowBirthDate: false
        LanguageCode: ENG
        AllowHealthInjuryOrDisease: false
        AllowPassportNumber: false
        AllowDeepWebUrls: false
        AllowBillingAccountNumber: false
        AllowStreetAddress: false
        AllowMedicalRecordNumber: false
        AllowPrivateKeys: false
        ProvideAnalysisRationale: true
        AllowVehicleID: false
        AllowSocialSecurityNumber: false
        AllowSourceCode: false
        AllowHttpCookie: false
        AllowCredentials: false
        AllowCity: false
        AllowMacAddress: false
        AllowHealthInsuranceNumber: false
        AllowDeviceID: false
        AllowHealthUniversalRecordLocator: false
        InputFile: InputFile
        AllowPersonName: false
        AllowHealthTypeOfTreatment: false
        AllowCreditCardVerificationCode: false
        AllowPhoneNumber: false
        CustomPolicyID: ""
        AllowIBAN: false
        AllowNamesOfRelatives: false
        AllowBiometrics: false
        AllowDriversLicense: false
        AllowTaxpayerID: false
        AllowHealthPlanBeneficiaryNumber: false
      properties:
        InputFile:
          description: "Audio file bytes (WAV, MP3, M4A, FLAC, OGG, or WMA) to transcribe\
            \ and scan for PII and sensitive data."
          format: byte
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
          type: string
        LanguageCode:
          description: Language code for speech recognition. Default is "ENG" (English).
          example: ENG
          type: string
        AllowEmailAddress:
          description: Set to true to allow email addresses in the audio transcript
            and not flag them as PII.
          example: false
          type: boolean
        AllowPhoneNumber:
          description: Set to true to allow phone numbers in the audio transcript
            and not flag them as PII.
          example: false
          type: boolean
        AllowStreetAddress:
          description: Set to true to allow street addresses in the audio transcript
            and not flag them as PII.
          example: false
          type: boolean
        AllowCity:
          description: Set to true to allow standalone city names (e.g. "San Francisco")
            in the audio transcript and not flag them as PII. Applies to city names
            mentioned outside of a full street address.
          example: false
          type: boolean
        AllowPersonName:
          description: Set to true to allow person names in the audio transcript and
            not flag them as PII.
          example: false
          type: boolean
