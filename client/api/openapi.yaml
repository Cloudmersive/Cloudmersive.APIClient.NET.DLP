            application/json:
              schema:
                $ref: '#/components/schemas/DlpAdvancedAudioDetectionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DlpAdvancedAudioDetectionResponse'
          description: OK
      summary: Detect User Data in Audio File (Advanced)
      tags:
      - Detect
      x-codegen-request-body-name: body
  /dlp/redact/text:
    post:
      description: "Detects and redacts configurable types of user data in an input\
        \ text string using Advanced AI. First detects PII, then redacts disallowed\
        \ types by either deleting them or replacing them with asterisks."
      operationId: RedactText
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlpRedactionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DlpRedactionRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DlpRedactionRequest'
        description: Input request
        required: false
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DlpRedactionResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DlpRedactionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DlpRedactionResponse'
          description: OK
      summary: Redact User Data in Input Text
      tags:
      - Redact
      x-codegen-request-body-name: body
  /dlp/redact/text/advanced:
    post:
      description: "Detects and redacts 34 configurable types of user data including\
        \ health-related PHI in an input text string using Advanced AI. First detects\
        \ PII, then redacts disallowed types by either deleting them or replacing\
