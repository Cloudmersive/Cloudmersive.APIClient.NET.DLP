            application/json:
              schema:
                $ref: '#/components/schemas/DlpAdvancedRedactionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DlpAdvancedRedactionResponse'
          description: OK
      summary: Redact User Data in Input Text (Advanced)
      tags:
      - Redact
      x-codegen-request-body-name: body
  /dlp/redact/document:
    post:
      description: "Detects and redacts configurable types of user data in a document\
        \ (PDF, DOC, DOCX, XLS, XLSX, PPT, PPTX, HTML, EML, MSG, PNG, JPG, WEBP) using\
        \ Advanced AI. Rasterizes document pages, detects PII regions using a grid-overlay\
        \ approach, blurs those regions, and returns a rasterized PDF."
