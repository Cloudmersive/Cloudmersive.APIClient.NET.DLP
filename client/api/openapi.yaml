                $ref: '#/components/schemas/DlpAudioDetectionResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DlpAudioDetectionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DlpAudioDetectionResponse'
          description: OK
      summary: Detect User Data in Audio File
      tags:
      - Detect
      x-codegen-request-body-name: body
  /dlp/detect/audio/advanced:
    post:
      description: "Transcribes an audio file (WAV, MP3, M4A, FLAC, OGG, WMA) and\
        \ detects 29 configurable types of user data including health-related PHI\
