            text/json:
              schema:
                $ref: '#/components/schemas/DlpAdvancedAudioRedactionResponse'
          description: OK
      summary: Redact User Data in Audio File (Advanced)
      tags:
      - Redact
      x-codegen-request-body-name: body
  /dlp/batch-job/detect/audio:
    post:
      description: "Creates an async batch job for detecting user data in an audio\
        \ file.  Use the GetAsyncJobStatus API to check on the status of the job and\
        \ retrieve the result when complete.  Transcribes an audio file (WAV, MP3,\
        \ M4A, FLAC, OGG, WMA) and detects 23 configurable types of user data in the\
        \ transcript using Advanced AI. Returns the full transcript, token timestamps,\
        \ and detection results.  Requires Managed Instance or Private Cloud deployment."
      operationId: DetectAudioBatchJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlpAudioDetectionRequest'
          text/json:
            schema:
