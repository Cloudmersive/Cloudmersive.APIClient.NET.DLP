      description: "Creates an async batch job for detecting user data in an audio\
        \ file using Advanced detection.  Use the GetAsyncJobStatus API to check on\
        \ the status of the job and retrieve the result when complete.  Transcribes\
        \ an audio file (WAV, MP3, M4A, FLAC, OGG, WMA) and detects 29 configurable\
        \ types of user data including health-related PHI in the transcript using\
        \ Advanced AI. Returns the full transcript, token timestamps, detection results,\
