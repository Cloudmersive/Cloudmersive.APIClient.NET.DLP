      x-codegen-request-body-name: body
  /dlp/batch-job/redact/audio:
    post:
      description: "Creates an async batch job for redacting user data in an audio\
        \ file.  Use the GetAsyncJobStatus API to check on the status of the job and\
        \ retrieve the redacted audio and transcript when complete.  Transcribes an\
